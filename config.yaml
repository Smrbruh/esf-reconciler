# ══════════════════════════════════════════════════════════════════════
#  config.yaml — Настройки инструмента сверки ЭСФ
#  АО КазАгроФинанс
# ══════════════════════════════════════════════════════════════════════

# ── Пути к входным файлам ──────────────────────────────────────────
# Укажите пути к файлам выгрузки относительно папки со скриптом.
# Поддерживаются форматы: .xlsx, .xls, .csv
file_1c:  "input/1c_export.xlsx"
file_esf: "input/esf_export.xlsx"

# ── Ключевая колонка (системный номер ЭСФ) ────────────────────────
# Название колонки с номером ЭСФ — именно по ней идёт сопоставление.
# Значения ДОЛЖНЫ совпадать в обоих файлах (регистр и пробелы игнорируются).
key_column:
  in_1c:  "Номер ЭСФ"      # Название колонки в файле 1С
  in_esf: "Рег. номер"     # Название колонки в файле ИС ЭСФ

# ── Маппинг сравниваемых реквизитов ───────────────────────────────
# Для каждого реквизита укажите название колонки в 1С (col_1c)
# и соответствующей колонки в ИС ЭСФ (col_esf).
# Если реквизит отсутствует в вашем файле — закомментируйте строки.
fields:
  "Дата":
    col_1c:  "Дата документа"
    col_esf: "Дата выписки"

  "Сумма оборота":
    col_1c:  "Сумма без НДС"
    col_esf: "Оборот"

  "Сумма НДС":
    col_1c:  "НДС"
    col_esf: "Сумма НДС"

  "Итого с НДС":
    col_1c:  "Сумма с НДС"
    col_esf: "Итого"

  "ИНН контрагента":
    col_1c:  "БИН/ИИН"
    col_esf: "БИН получателя"

  "Контрагент":
    col_1c:  "Наименование контрагента"
    col_esf: "Получатель"

# ── Допустимая погрешность при сравнении сумм ──────────────────────
# Разница до этого значения (в тенге) считается допустимой.
# Например: 1.0 означает, что суммы 1000.00 и 1000.99 — совпадают.
amount_tolerance: 1.0

# ── Настройки CSV (если входные файлы в формате .csv) ──────────────
csv_encoding:  "utf-8-sig"   # Кодировка: utf-8-sig, cp1251, utf-8
csv_delimiter: ";"           # Разделитель: ; или ,

# ── Папка для сохранения отчёта ────────────────────────────────────
# Будет создана автоматически, если не существует.
output_dir: "output"
